name: Full SINTA Sync

on:
  schedule:
    # Dua kali sebulan: tanggal 2 dan 16 pukul 02.17 WIB
    # (tanggal 1 dan 15 pukul 19.17 UTC).
    - cron: "17 19 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-sinta-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration and parser
        run: |
          python scripts/scrape_sinta.py --check-config
          python -m unittest discover -s tests -v

      - name: Scrape all public SINTA pages through Premium Proxy
        run: python scripts/scrape_sinta.py --all-views

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: full SINTA sync $(date -u +'%Y-%m-%d')"
            git push
          fi
