name: Weekly SINTA Sync

on:
  schedule:
    # Setiap Minggu 02.17 WIB (Sabtu 19.17 UTC).
    - cron: "17 19 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-sinta-sync
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate configuration and parser
        run: |
          python scripts/scrape_sinta.py --check-config
          python -m unittest discover -s tests -v

      - name: Scrape public SINTA pages
        id: scrape
        continue-on-error: true
        run: python scripts/scrape_sinta.py

      - name: Report access warning
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::SINTA menolak request dari IP GitHub runner. JSON lama dipertahankan."

      - name: Commit updated JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: weekly SINTA sync $(date -u +'%Y-%m-%d')"
            git push
          fi
